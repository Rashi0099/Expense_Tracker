version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-expense_db}
      POSTGRES_USER: ${DATABASE_USER:-expense_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-expense_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-expense_user} -d ${DATABASE_NAME:-expense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
 